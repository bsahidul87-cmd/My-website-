<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>শিখি – ইংরেজি, আরবি, বিজ্ঞান ও গণিত</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1f2a2e;--mute:#6b777c;--line:#e2ddd0;--g:#2f9e6b;--gd:#1f7a50;--gl:#d8f1e4;--r:#e0524a;--rl:#fbdcd9;--y:#f2b42c;--b:#2f7fd1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201f;--card:#1d2d2c;--ink:#eef3f1;--mute:#93a5a2;--line:#2f4442;--gl:#1f4a38;--rl:#4a2523}}
:root[data-theme="dark"]{--bg:#14201f;--card:#1d2d2c;--ink:#eef3f1;--mute:#93a5a2;--line:#2f4442;--gl:#1f4a38;--rl:#4a2523}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#app{max-width:480px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top h1{font-size:26px;margin:0;color:var(--g)}
.stats{display:flex;gap:12px;font-weight:700}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tab{flex:0 0 auto;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font:600 16px inherit;font-family:inherit;cursor:pointer}
.tab[aria-selected="true"]{background:var(--g);border-color:var(--gd);color:#fff}
.banner{background:var(--g);color:#fff;border-radius:18px;padding:16px;margin-bottom:22px}
.banner b{font-size:20px}
.banner p{margin:4px 0 0;opacity:.92}
.path{display:flex;flex-direction:column;align-items:center;gap:20px}
.node{width:84px;height:84px;border-radius:50%;border:0;background:var(--g);color:#fff;font:700 30px inherit;font-family:inherit;box-shadow:0 7px 0 var(--gd);cursor:pointer;display:flex;align-items:center;justify-content:center}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--gd)}
.node.done{background:var(--y);box-shadow:0 7px 0 #b8861a}
.node.lock{background:var(--line);box-shadow:0 7px 0 #c9c3b3;color:var(--mute);cursor:not-allowed}
.lbl{font-weight:600;margin-top:-10px;text-align:center}
.node:nth-child(4n+2){margin-left:70px}.node:nth-child(4n+4){margin-right:70px}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.x{background:none;border:0;color:var(--mute);font-size:28px;cursor:pointer}
.prog{flex:1;height:14px;background:var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--g);border-radius:9px;transition:width .3s}
h2.q{font-size:22px;margin:0 0 6px}
.say{display:inline-flex;align-items:center;gap:8px;margin:6px 0 18px;border:2px solid var(--line);background:var(--card);color:var(--b);border-radius:14px;padding:8px 14px;font:600 16px inherit;font-family:inherit;cursor:pointer}
.word{font-size:34px;margin:10px 0 18px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);color:var(--ink);border-radius:14px;padding:14px 16px;font:600 18px inherit;font-family:inherit;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--b);background:rgba(47,127,209,.12)}
.foot{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line)}
.foot.ok{background:var(--gl)}.foot.bad{background:var(--rl)}
.foot .in{max-width:480px;margin:0 auto}
.msg{font-weight:700;font-size:18px;margin-bottom:10px;min-height:0}
.go{width:100%;border:0;border-radius:14px;padding:14px;background:var(--g);color:#fff;font:700 18px inherit;font-family:inherit;box-shadow:0 5px 0 var(--gd);cursor:pointer}
.go[disabled]{background:var(--line);color:var(--mute);box-shadow:0 5px 0 #c9c3b3;cursor:not-allowed}
.foot.bad .go{background:var(--r);box-shadow:0 5px 0 #a8342d}
.res{text-align:center;padding-top:40px}
.res .big{font-size:64px}
.res .row{display:flex;gap:12px;justify-content:center;margin:20px 0 30px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 18px;font-weight:700}
.sp{height:130px}
.hint{color:var(--mute);margin:0 0 14px}.cards{display:grid;gap:10px}.lc{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px}.lc .f{color:var(--mute);font-size:15px}.lc .b{font-size:20px;font-weight:700;color:var(--g)}.say.sm{margin:0;padding:8px 12px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .opts{align-content:start}
.mb{border:2px solid var(--line);border-bottom-width:5px;background:var(--card);color:var(--ink);border-radius:14px;padding:12px 8px;font:600 16px inherit;font-family:inherit;cursor:pointer;min-height:56px;word-break:break-word}
.mb.sel{border-color:var(--b);background:rgba(47,127,209,.12)}.mb.ok{border-color:var(--g);background:var(--gl);opacity:.6;cursor:default}.mb.no{border-color:var(--r);background:var(--rl)}
.it{display:flex;flex-direction:column;align-items:center;gap:8px}.it .lbl{margin-top:0}
.jump{display:flex;gap:8px;margin-bottom:22px}.jump input{flex:1;min-width:0;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font:600 16px inherit;font-family:inherit;background:var(--card);color:var(--ink)}
.tabs{scrollbar-width:thin}
:root{--ac:#2f9e6b;--acd:#1f7a50}
body{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 12%,var(--bg)),var(--bg) 280px) no-repeat var(--bg);min-height:100vh}
.top h1{color:var(--ac)}
.tab[aria-selected="true"]{background:var(--ac);border-color:var(--acd);color:#fff}
.banner{background:linear-gradient(135deg,var(--ac),var(--acd));position:relative;overflow:hidden}
.banner::after{content:attr(data-e);position:absolute;right:-4px;bottom:-24px;font-size:100px;opacity:.2;pointer-events:none}
.node{background:var(--ac);box-shadow:0 7px 0 var(--acd)}
.node:active{box-shadow:0 2px 0 var(--acd)}
.prog i{background:var(--ac)}
.go{background:var(--ac);box-shadow:0 5px 0 var(--acd)}
.lc .b{color:var(--ac)}
.it{display:flex;flex-direction:column;align-items:center;gap:8px}
.arb{font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;font-size:1.3em;line-height:1.7;unicode-bidi:isolate}
.cd{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px;text-align:right;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.ce{font-size:22px;color:var(--mute);word-break:break-all;min-height:28px}
.cr{font-size:34px;font-weight:700;word-break:break-all}
.kg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.kb{border:2px solid var(--line);border-bottom-width:5px;border-radius:12px;padding:12px 0;font:700 18px inherit;font-family:inherit;background:var(--card);color:var(--ink);cursor:pointer}
.kb.o{color:var(--ac)}.kb.eq{background:var(--ac);color:#fff;border-color:var(--acd)}
.kb:active{transform:translateY(3px);border-bottom-width:2px}
.sel{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font:600 16px inherit;font-family:inherit;background:var(--card);color:var(--ink)}
.flds{display:grid;gap:10px}.fl{display:grid;gap:4px;font-weight:600}.fl small{color:var(--mute);font-weight:400}
.fl input{border:2px solid var(--line);border-radius:12px;padding:11px 14px;font:600 18px inherit;font-family:inherit;background:var(--card);color:var(--ink)}
.rb{border-radius:14px;padding:14px 16px;font-weight:600}.rb.ok{background:var(--gl)}.rb.bad{background:var(--rl)}.rb .ln{padding:4px 0}
.stp{margin-top:6px;color:var(--mute);font-weight:400;word-break:break-word}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
</style>
</head>

 <div class="sp"></div>
 <div class="foot" id="foot"><div class="in"><div class="msg" id="msg"></div><button class="go" id="go" disabled>যাচাই করো</button></div></div>`;
 $(".x").onclick=exitQ;
 const sy=$(".say");if(sy){sy.onclick=()=>speak(q[3],s.lang);if(cur!=="sc")speak(q[3],s.lang)}
 const ob=[...app.querySelectorAll(".opt")];
 ob.forEach(b=>b.onclick=()=>{if(Q.checked)return;ob.forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");Q.sel=b.textContent;$("#go").disabled=false});
 Q.sel=null;Q.checked=false;
 $("#go").onclick=()=>check(q,ob);
}
function askMatch(it){
 const Ls=shuf(it.m.map((p,i)=>[p[0],i])),Rs=shuf(it.m.map((p,i)=>[p[1],i]));
 app.innerHTML=`${barH()}
 <h2 class="q">🔗 জোড়া মেলাও</h2><p class="hint">বাম ও ডান থেকে মিল খুঁজে একে একে ট্যাপ করো।</p>
 <div class="mt"><div class="opts">${Ls.map(x=>`<button class="mb" data-s="l" data-i="${x[1]}">${fmtA(x[0])}</button>`).join("")}</div>
 <div class="opts">${Rs.map(x=>`<button class="mb" data-s="r" data-i="${x[1]}">${fmtA(x[0])}</button>`).join("")}</div></div>
 <div class="sp"></div>
 <div class="foot" id="foot"><div class="in"><div class="msg" id="msg"></div><button class="go" id="go" disabled>চালিয়ে যাও</button></div></div>`;
 $(".x").onclick=exitQ;
 Q.checked=false;
 let sel=null,left=it.m.length;
 const bs=[...app.querySelectorAll(".mb")];
 bs.forEach(b=>b.onclick=()=>{
  if(b.classList.contains("ok")||Q.checked)return;
  if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove("sel");sel=b;b.classList.add("sel");return}
  const a=sel;sel=null;a.classList.remove("sel");
  if(a.dataset.i===b.dataset.i){
   [a,b].forEach(x=>{x.classList.add("ok");x.disabled=true});
   if(--left===0){Q.checked=true;Q.right++;$("#foot").className="foot ok";$("#msg").style.color="var(--gd)";$("#msg").textContent="✅ সব জোড়া ঠিক!";$("#go").disabled=false}
  }else{
   Q.hearts--;$("#hc").textContent="❤️ "+bn(Q.hearts);
   [a,b].forEach(x=>x.classList.add("no"));
   setTimeout(()=>[a,b].forEach(x=>x.classList.remove("no")),500);
   if(Q.hearts<=0){Q.checked=true;$("#foot").className="foot bad";$("#msg").style.color="var(--r)";$("#msg").textContent="❌ হার্ট শেষ";$("#go").disabled=false}
  }
 });
 $("#go").onclick=()=>{if(Q.hearts<=0)return end(false);Q.n++;Q.n>=Q.qs.length?end(true):ask()};
}
function check(q,ob){
 const go=$("#go"),foot=$("#foot"),msg=$("#msg");
 if(Q.checked){ if(Q.hearts<=0)return end(false); Q.n++; return Q.n>=Q.qs.length?end(true):ask(); }
 Q.checked=true;
 const ok=Q.sel===q[1];
 if(ok){Q.right++;foot.className="foot ok";msg.style.color="var(--gd)";msg.textContent="✅ সঠিক! চমৎকার।"}
 else{Q.hearts--;$("#hc").textContent="❤️ "+bn(Q.hearts);foot.className="foot bad";msg.style.color="var(--r)";msg.textContent="❌ ভুল। "+(q[4]||"সঠিক উত্তর: "+q[1])}
 ob.forEach(b=>{b.disabled=true;if(b.textContent===q[1])b.style.borderColor="var(--g)"});
 go.textContent="চালিয়ে যাও";
}
function end(win){
 const s=SUBJ[cur];
 if(win){
  const gain=10+Q.right*2;S.xp+=gain;
  if(S.last!==today()){const y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===y?S.streak+1:1;S.last=today()}
  if(Q.i>=0)S.done[cur+Q.i]=1;save();
  app.innerHTML=`<div class="res"><div class="big">🎉</div><h2>${Q.i<0?"কুইজ শেষ!":"পাঠ শেষ!"}</h2><div class="row"><div class="chip">⭐ +${bn(gain)} XP</div><div class="chip">🎯 ${bn(Q.right)}/${bn(Q.qs.length)}</div><div class="chip">🔥 ${bn(S.streak)} দিন</div></div><button class="go" id="h">চালিয়ে যাও</button></div>`;
 }else{
  app.innerHTML=`<div class="res"><div class="big">💔</div><h2>হার্ট শেষ</h2><p>চিন্তা নেই, আবার চেষ্টা করো।</p><div class="sp" style="height:20px"></div><button class="go" id="h">আবার চেষ্টা করো</button></div>`;
 }
 $("#h").onclick=home;
}
home();
</script>
</body>
</html>
